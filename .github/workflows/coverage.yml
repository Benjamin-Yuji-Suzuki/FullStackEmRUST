name: Cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configurar ferramentas de cobertura
        run: rustup component add llvm-tools-preview

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2
        with:
          tool: cargo-llvm-cov

      - name: Rodar testes com cobertura
        run: cargo llvm-cov --lcov --output-path lcov.info -p server -- --skip ignored
        working-directory: fuzzysimulated

      - name: Enviar ao Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: fuzzysimulated/lcov.info
