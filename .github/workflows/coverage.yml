name: Cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost/fuzzysimulated_test
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: fuzzysimulated_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Configurar Rust
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          components: llvm-tools-preview

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@65851e10cd6c377f11a60e600abc07cb08643468 # v2
        with:
          tool: cargo-llvm-cov

      - name: Instalar PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Rodar migrations
        run: |
          for f in server/migrations/*.sql; do
            echo "=== $f ==="
            psql "$DATABASE_URL" -f "$f"
          done
        working-directory: fuzzysimulated

      - name: Rodar testes com cobertura
        run: cargo llvm-cov --lcov --output-path lcov.info -p server --ignore-run-fail -- --test-threads=4
        working-directory: fuzzysimulated

      - name: Enviar ao Codecov
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: fuzzysimulated/lcov.info
