name: Cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar ferramentas de cobertura
        run: rustup component add llvm-tools-preview

      - name: Instalar cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Rodar testes com cobertura
        run: cargo llvm-cov --lcov --output-path lcov.info -p server -- --skip ignored
        working-directory: fuzzysimulated

      - name: Enviar ao Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: fuzzysimulated/lcov.info
